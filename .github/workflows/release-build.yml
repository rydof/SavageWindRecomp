name: Build and Publish Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g. v0.6.0-beta1-enhanced-1)'
        required: true
        default: 'v0.6.0-beta1-enhanced-1'

permissions:
  contents: write

jobs:
  build-linux:
    name: Linux AppImage (${{ matrix.variant }})
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - variant: enhanced
            branch: enhanced-faithful
          - variant: coop
            branch: coop-addon
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ matrix.branch }}

      - name: Install build dependencies (Containerfile parity)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            ca-certificates curl git file xz-utils patchelf make cmake ninja-build pkg-config nasm python3 \
            g++ software-properties-common gpg-agent \
            libx11-dev libxext-dev libxrandr-dev libxcursor-dev libxi-dev libxss-dev libxfixes-dev libxtst-dev \
            libxkbcommon-dev libwayland-dev wayland-protocols libdecor-0-dev libegl-dev libgl-dev libdrm-dev libgbm-dev \
            libpulse-dev libasound2-dev libpipewire-0.3-dev libdbus-1-dev libudev-dev libibus-1.0-dev \
            libvulkan-dev
          sudo add-apt-repository -y ppa:deadsnakes/ppa
          curl -fsSL https://apt.llvm.org/llvm-snapshot.gpg.key | sudo tee /etc/apt/trusted.gpg.d/apt.llvm.org.asc >/dev/null
          echo "deb http://apt.llvm.org/jammy/ llvm-toolchain-jammy-21 main" | sudo tee /etc/apt/sources.list.d/llvm.list >/dev/null
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends python3.12 python3.12-venv python3.12-dev clang-21 lld-21 llvm-21
          for t in clang clang++ ld.lld llvm-ar llvm-nm llvm-ranlib llvm-strip; do
            sudo ln -sf "$t-21" "/usr/bin/$t"
          done

      - name: Freeze game code generator helper (swgen)
        run: bash tools/linux/gen_helper.sh x86_64

      - name: Build and package AppImage
        run: |
          bash tools/linux/package.sh x86_64
          mkdir -p dist-out
          src=$(ls build/dist/Savage_Wind-*-x86_64.AppImage | head -n 1)
          mv "$src" "dist-out/Savage_Wind-0.6.0-beta1-${{ matrix.variant }}-x86_64.AppImage"
          chmod +x "dist-out/Savage_Wind-0.6.0-beta1-${{ matrix.variant }}-x86_64.AppImage"
          ls -lh dist-out/

      - uses: actions/upload-artifact@v4
        with:
          name: linux-${{ matrix.variant }}
          path: dist-out/*.AppImage

  build-windows:
    name: Windows Package (${{ matrix.variant }})
    runs-on: windows-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - variant: enhanced
            branch: enhanced-faithful
          - variant: coop
            branch: coop-addon
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ matrix.branch }}

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            make zip unzip curl mingw-w64-ucrt-x86_64-clang mingw-w64-ucrt-x86_64-lld
            mingw-w64-ucrt-x86_64-sdl3 mingw-w64-ucrt-x86_64-ffmpeg
            mingw-w64-ucrt-x86_64-vulkan-headers mingw-w64-ucrt-x86_64-vulkan-loader
            mingw-w64-ucrt-x86_64-shaderc mingw-w64-ucrt-x86_64-spirv-tools
            mingw-w64-ucrt-x86_64-pkgconf mingw-w64-ucrt-x86_64-nasm

      - name: Build LGPL FFmpeg, swgen, Zig, and package Windows release zip
        shell: msys2 {0}
        env:
          WIN_PY_DIR: ${{ env.pythonLocation }}
        run: |
          set -euo pipefail
          GEN_PY="$(cygpath -u "$WIN_PY_DIR/python.exe")"
          make deps-windows
          make gen-helper GEN_PY="$GEN_PY"
          bash tools/fetch_zig.sh
          make dist DIST_PGO= DIST_LTO=thin
          mkdir -p dist-out
          src=$(ls build/dist/SavageWind-*-windows.zip | head -n 1)
          mv "$src" "dist-out/SavageWind-0.6.0-beta1-${{ matrix.variant }}-windows-x64.zip"
          ls -lh dist-out/

      - uses: actions/upload-artifact@v4
        with:
          name: windows-${{ matrix.variant }}
          path: dist-out/*.zip

  publish:
    name: Publish GitHub Release
    needs: [build-linux, build-windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Generate SHA256SUMS and publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG="${{ github.event.inputs.tag || github.ref_name }}"
          cd release-assets
          sha256sum * > SHA256SUMS.txt
          cat SHA256SUMS.txt
          cat > /tmp/release_notes.md <<'EOF'
          ## Savage Wind Recomp — Community Enhanced & Co-op Release

          > **Fork notice:** Community fork of [Revivedx/SavageWindRecomp](https://github.com/Revivedx/SavageWindRecomp), built on top of **0.6.0-alpha.6** (`test` branch / Beta 1, upstream commit `184cc9e`).
          > **No Nintendo game files, keys, firmware, or generated game code are included.** Supply your own Switch 1.9.0 dump on first launch; the app builds `swgame` locally on your PC.

          ### Packages Included
          - **Non-Co-op (Single-Player Faithful Enhanced — `enhanced-faithful`):**
            - `Savage_Wind-0.6.0-beta1-enhanced-x86_64.AppImage` (Linux x86-64, glibc 2.35+)
            - `SavageWind-0.6.0-beta1-enhanced-windows-x64.zip` (Windows x64 — includes `savagewind.exe`, `Savage Wind Configuration.exe`, `SW Update.exe`, `swgen/`, `zig/`, DLLs)
          - **Co-op Edition (includes everything above + optional off-by-default online Co-op & Character Creator — `coop-addon`):**
            - `Savage_Wind-0.6.0-beta1-coop-x86_64.AppImage` (Linux x86-64, glibc 2.35+)
            - `SavageWind-0.6.0-beta1-coop-windows-x64.zip` (Windows x64 — includes `savagewind.exe`, `Savage Wind Configuration.exe`, `SW Update.exe`, `swgen/`, `zig/`, DLLs)
          - **`SHA256SUMS.txt`**: SHA-256 checksums for all packages.

          ### Highlights
          - Automatic PlayStation, Xbox, Steam Deck, Nintendo Switch, and Keyboard/Mouse button prompts with live 4-button HUD diamond layout
          - Built-in save-isolated cinematic benchmark (`F1 > Benchmark`) with 1%/0.1% lows and CSV/Markdown export
          - Full Accessibility suite (`F1 > Gameplay > Accessibility`): God mode, No fall damage, Health regeneration, Game speed (50–200%), On-screen Link & Enemy health HUD, colour vision filters, damage/stamina/weapon-wear multipliers, toggle ZL/ZR/sprint
          - Graphics & QoL: HBAO, grass ground cover, Fixed high LOD, map zoom blur toggle, native-res minimap, cutscenes at 16:9, map completion rate (`#1179`), improved horse controls (`#1172`), 6 GB NVIDIA BDA fix (`#1177`), 4K quick-menu stall fix (`#1176`), symmetric high-FPS windbomb glide fix (`#1183`), F1 choice-row fix (`#1182`)
          - Optional Co-op Add-on (`coop` packages only): off by default, LAN/online multiplayer with Character Creator (`OnlineAppearance` persistence + `M_APPEARANCE` live sync)
          EOF
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" * --clobber
          else
            gh release create "$TAG" * \
              --title "Savage Wind Enhanced & Co-op ($TAG)" \
              --notes-file /tmp/release_notes.md \
              --prerelease
          fi
